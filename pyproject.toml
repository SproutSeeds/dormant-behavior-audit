[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dormant-behavior-audit"
version = "1.0.1"
description = "Benchmark assets, reproducibility tooling, and evidence checks for dormant behavior audit."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-docs.md"]
authors = [
  { name = "Cody Mitchell" }
]
keywords = [
  "benchmark",
  "llm-evals",
  "model-auditing",
  "reproducibility",
  "dormant-behavior",
  "interpretability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "accelerate>=0.27.0",
  "datasets>=2.18.0",
  "huggingface_hub>=0.21.0",
  "ipywidgets>=8.1.0",
  "jsinfer",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "plotly>=5.18.0",
  "safetensors>=0.4.2",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "seaborn>=0.13.0",
  "torch>=2.1.0",
  "tqdm>=4.66.0",
  "transformers>=4.40.0",
  "umap-learn>=0.5.5",
]

[project.optional-dependencies]
notebooks = [
  "jupyter>=1.0.0",
  "notebook>=7.0.0",
]
tui = [
  "textual>=0.58.1",
]
publish = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.scripts]
dba = "dormant_behavior_audit.cli:main"
dormant-behavior-audit = "dormant_behavior_audit.cli:main"

[project.urls]
Homepage = "https://sproutseeds.github.io/dormant-behavior-audit/"
Repository = "https://github.com/SproutSeeds/dormant-behavior-audit"
Documentation = "https://sproutseeds.github.io/dormant-behavior-audit/"
Package = "https://pypi.org/project/dormant-behavior-audit/"
Changelog = "https://github.com/SproutSeeds/dormant-behavior-audit/releases"
Issues = "https://github.com/SproutSeeds/dormant-behavior-audit/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "artifacts*",
  "benchmarks*",
  "dormant_behavior_audit*",
  "findings*",
  "orbit*",
  "problems*",
  "scripts*",
  "src*",
]
