name: package-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Run public safety scan
        run: python scripts/check_public_safety.py

      - name: Verify artifact hashes
        run: python scripts/check_artifact_hashes.py

      - name: Validate starter profiles
        run: python scripts/check_submission_starters.py

      - name: Validate multi-turn suite
        run: python scripts/check_multiturn_suite.py

      - name: Regenerate scoreboard and require no drift
        run: |
          python scripts/build_submission_scoreboard.py
          git diff --exit-code artifacts/submissions/SCOREBOARD.json artifacts/submissions/SCOREBOARD.md benchmarks/public/SUBMISSION_SCOREBOARD.json benchmarks/public/SUBMISSION_SCOREBOARD.md

      - name: Run CLI smoke tests
        run: python -m unittest discover -s tests

      - name: Build distributions
        run: python -m build

      - name: Check package size
        run: python scripts/check_package_size.py --require-dist

      - name: Check package contents
        run: python scripts/check_package_contents.py

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv /tmp/dba-smoke

      - name: Install wheel without extra dependencies
        run: /tmp/dba-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Check CLI version
        run: /tmp/dba-smoke/bin/dba version

      - name: Check CLI help
        run: /tmp/dba-smoke/bin/dba help

      - name: Check CLI task listing
        run: /tmp/dba-smoke/bin/dba list-tasks

      - name: Check CLI scoreboard from installed wheel
        run: /tmp/dba-smoke/bin/dba scoreboard --json

      - name: Check CLI doctor
        run: /tmp/dba-smoke/bin/dba doctor
