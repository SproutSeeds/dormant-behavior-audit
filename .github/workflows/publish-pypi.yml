name: publish-pypi

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'package-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Check package contents
        run: python scripts/check_package_contents.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/

  smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'package-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv /tmp/dba-publish-smoke

      - name: Install wheel without extra dependencies
        run: /tmp/dba-publish-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Check CLI version
        run: /tmp/dba-publish-smoke/bin/dba version

      - name: Check CLI task listing
        run: /tmp/dba-publish-smoke/bin/dba list-tasks

      - name: Check CLI scoreboard from installed wheel
        run: /tmp/dba-publish-smoke/bin/dba scoreboard --json

      - name: Check CLI doctor
        run: /tmp/dba-publish-smoke/bin/dba doctor

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'package-v')
    needs:
      - build
      - smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dormant-behavior-audit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
